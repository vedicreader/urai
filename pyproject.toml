[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uraiyadal"
dynamic = ["version"]
description = "the chat conventions every backend shares"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Karthik", email = "karthik.rajgopal@hotmail.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastcore>=2.1.16",
    "aidialog>=0.0.22",
    "python-fastllm>=0.0.41",
    "safepyrun>=0.2.3",
    "truststore>=0.10",
    "httpx",
    "diskcache>=5.6.3"
]

[project.urls]
Repository = "https://github.com/vedicreader/urai"
Documentation = "https://vedicreader.github.io/urai/"

[project.entry-points.nbdev]
urai = "urai._modidx:d"

[tool.nbdev]

[tool.hatch.build.targets.wheel]
packages = ["urai"]

[tool.hatch.build.targets.sdist]
include = ["/urai", "/README.md", "/pyproject.toml"]

[tool.hatch.version]
path = "urai/__init__.py"

[dependency-groups]
dev = [
    "nbdev>=3.1.0",
    "notebook>=7.6.0",
    "ipykernel>=7.3.0",
    "pytest>=8.0.0",
]